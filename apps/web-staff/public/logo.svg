<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE259"/>
      <stop offset="50%" stop-color="#FFA751"/>
      <stop offset="100%" stop-color="#E5A635"/>
    </linearGradient>
    <linearGradient id="goldGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7D070"/>
      <stop offset="100%" stop-color="#C58B2B"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Shield Base Outer Contour -->
  <path d="M50 8 L82 22 V48 C82 68 68 84 50 92 C32 84 18 68 18 48 V22 Z" fill="none" stroke="url(#gold)" stroke-width="4.5" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Shield Inner Wall -->
  <path d="M50 14 L76 26 V48 C76 64 64 78 50 85 C36 78 24 64 24 48 V26 Z" fill="none" stroke="url(#goldGlow)" stroke-width="1.8" opacity="0.6"/>

  <!-- Star Symbol -->
  <polygon points="50,22 52,27 57,27 53,30 55,35 50,32 45,35 47,30 43,27 48,27" fill="url(#gold)"/>

  <!-- Globe Latitudes / Longitudes -->
  <circle cx="53" cy="53" r="10" fill="none" stroke="url(#gold)" stroke-width="1.2" opacity="0.8"/>
  <ellipse cx="53" cy="53" rx="10" ry="4" fill="none" stroke="url(#gold)" stroke-width="1" opacity="0.7"/>
  <line x1="53" y1="43" x2="53" y2="63" stroke="url(#gold)" stroke-width="1" opacity="0.7"/>

  <!-- Giant Dynamic Checkmark & Airplane Swoosh -->
  <path d="M30 46 L44 60 L80 20 L76 18 L44 54 L32 42 Z" fill="url(#gold)" filter="url(#glow)"/>
  
  <!-- Airplane Tail -->
  <path d="M80 20 L86 16 L84 22 L82 20 Z" fill="url(#gold)"/>
  <path d="M80 20 L75 14 L77 21 Z" fill="url(#gold)"/>
</svg>
