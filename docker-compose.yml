version: '3.8'

services:
  # ---------------------------------------------------------------------------
  # 1. PostgreSQL 16 (Relational Database)
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: basechanfunder-postgres
    restart: always
    environment:
      POSTGRES_DB: basechanfunder_db
      POSTGRES_USER: basechan_admin
      POSTGRES_PASSWORD: SecureBasechanPassword2026!
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U basechan_admin -d basechanfunder_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # 2. Redis (Caching & Session Layer)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: basechanfunder-redis
    restart: always
    command: redis-server --requirepass SecureRedisPassword2026!
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "SecureRedisPassword2026!", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # 3. HashiCorp Vault (Secrets Engine)
  # ---------------------------------------------------------------------------
  vault:
    image: hashicorp/vault:1.15
    container_name: basechanfunder-vault
    restart: always
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: root_dev_vault_token
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    ports:
      - "8200:8200"
    cap_add:
      - IPC_LOCK
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ---------------------------------------------------------------------------
  # 4. Redpanda (Kafka Compatible Event Bus)
  # ---------------------------------------------------------------------------
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v23.3.3
    container_name: basechanfunder-redpanda
    restart: always
    command:
      - redpanda start
      - --smp 1
      - --memory 1G
      - --reserve-memory 0M
      - --overprovisioned
      - --node-id 0
      - --kafka-addr PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092
    ports:
      - "9092:9092"
      - "9644:9644"
    volumes:
      - redpanda_data:/var/lib/redpanda/data

volumes:
  postgres_data:
  redis_data:
  redpanda_data:
